name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_browser_tests:
        description: "Also run BrowserPipelineTest (launches real Chrome, needs a display)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-clang-debug
          - os: ubuntu-latest
            preset: linux-clang-debug
          - os: macos-latest
            preset: macos-clang-debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Provides a recent CMake (project requires 4.0+) and Ninja, both on PATH.
      - uses: lukka/get-cmake@latest

      # windows-clang-* presets use clang.exe targeting MSVC ABI, so link.exe/the Windows SDK
      # still need to be on PATH - matches how this preset is used locally from a VS Developer
      # shell.
      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # linux-clang-* presets hard-code /usr/bin/clang-22, which ubuntu-latest doesn't ship.
      # glfw3 also needs X11 dev headers to configure, which the runner doesn't ship either.
      - name: Install LLVM/Clang 22 and X11 dev headers
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      # Vendor/CMakeLists.txt builds Stockfish via its own Makefile through MSYS2's bash,
      # hard-coded at C:/msys64 - windows-latest already has MSYS2 there, so just add the
      # mingw toolchain to it rather than having the setup-msys2 action try to install fresh.
      - name: Install MinGW-w64 toolchain into existing MSYS2
        if: runner.os == 'Windows'
        run: |
          & "C:\msys64\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm --needed base-devel mingw-w64-x86_64-toolchain"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9d7f79f56ae1a9b4704d6a7fb8237e347a974133

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Install Xvfb
        if: runner.os == 'Linux' && github.event.inputs.run_browser_tests == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test
        working-directory: out/build/${{ matrix.preset }}
        shell: bash
        env:
          RUN_BROWSER_TESTS: ${{ github.event.inputs.run_browser_tests }}
        run: |
          EXCLUDE=(-E "^BrowserPipelineTest\.")
          if [ "$RUN_BROWSER_TESTS" = "true" ]; then
            EXCLUDE=()
          fi
          if [ "$RUNNER_OS" = "Linux" ] && [ "$RUN_BROWSER_TESTS" = "true" ]; then
            xvfb-run -a ctest --output-on-failure "${EXCLUDE[@]}"
          else
            ctest --output-on-failure "${EXCLUDE[@]}"
          fi
