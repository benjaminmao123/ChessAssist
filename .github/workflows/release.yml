name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-clang-release
            asset_name: windows-x64
          - os: ubuntu-latest
            preset: linux-clang-release
            asset_name: linux-x64
          - os: macos-latest
            preset: macos-clang-release
            asset_name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM/Clang 22 and X11 dev headers
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev autoconf autoconf-archive automake libtool libltdl-dev

      # windows-latest already has MSYS2 at C:\msys64, so add the mingw toolchain to it
      # rather than having the setup-msys2 action try to install fresh there.
      - name: Install MinGW-w64 toolchain into existing MSYS2
        if: runner.os == 'Windows'
        run: |
          & "C:\msys64\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm --needed base-devel mingw-w64-x86_64-toolchain"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9d7f79f56ae1a9b4704d6a7fb8237e347a974133

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-${{ matrix.os }}-${{ matrix.preset }}
          max-size: 500M

      # See ci.yml for why this is needed on top of CMAKE_*_COMPILER_LAUNCHER - Stockfish's
      # own Makefile calls the compiler by bare name, not through CMake.
      - name: Route Stockfish's compiler through ccache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ccache-masquerade"
          CCACHE_BIN=$(command -v ccache)
          for name in gcc g++ cc c++; do
            ln -sf "$CCACHE_BIN" "$RUNNER_TEMP/ccache-masquerade/$name"
          done
          echo "$RUNNER_TEMP/ccache-masquerade" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Gate the release on the same unit tests CI runs; BrowserPipelineTest is skipped here
      # too - it needs a real Chrome window/display, see ci.yml.
      - name: Test
        working-directory: out/build/${{ matrix.preset }}
        shell: bash
        run: ctest --output-on-failure -E "^BrowserPipelineTest\."

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "out/build/${{ matrix.preset }}/Source"
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$out/*.exe" $dist
          if (Test-Path "$out/*.dll") { Copy-Item "$out/*.dll" $dist }
          Copy-Item "$out/Assets" $dist -Recurse
          Compress-Archive -Path "$dist/*" -DestinationPath "ChessAssist-${{ github.ref_name }}-${{ matrix.asset_name }}.zip"

      # Stockfish now lands in Assets/Engine (see Vendor/CMakeLists.txt) rather than loose next
      # to the binary, so the Assets copy below already carries it - no separate stockfish copy
      # needed.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          out="out/build/${{ matrix.preset }}/Source"
          dist="dist"
          mkdir -p "$dist"
          cp "$out/ChessAssist" "$dist/"
          cp -r "$out/Assets" "$dist/"
          cp "$out"/*.so* "$dist/" 2>/dev/null || true
          tar -czf "ChessAssist-${{ github.ref_name }}-${{ matrix.asset_name }}.tar.gz" -C "$dist" .

      # ChessAssist builds as a proper .app bundle on macOS (see Source/CMakeLists.txt) - it
      # already carries the binary, Stockfish, Assets, and the .icns icon inside itself, so
      # packaging is just archiving the whole bundle rather than assembling loose files.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          out="out/build/${{ matrix.preset }}/Source"
          dist="dist"
          mkdir -p "$dist"
          cp -r "$out/ChessAssist.app" "$dist/"
          tar -czf "ChessAssist-${{ github.ref_name }}-${{ matrix.asset_name }}.tar.gz" -C "$dist" .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ChessAssist-*.zip
            ChessAssist-*.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
